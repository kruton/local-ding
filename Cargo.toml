[package]
name = "local-ding"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[features]
settings-test = []

[dependencies]
libc = { version = "=0.2.191", default-features = false }
rumqttc = { version = "=0.25.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = { version = "=3.27.0", default-features = false }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "io-util", "signal", "macros"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
