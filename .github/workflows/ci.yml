name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.25"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: uv sync --locked
      - run: uv run --frozen python scripts/format_assets.py --check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen ruff check
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential fakeroot mtd-utils liblzo2-2 qemu-user bzip2 openssh-client
      - name: Rust and public toolchain
        run: |
          rustup toolchain install nightly-2026-11-01 --profile minimal --component rustfmt --component rust-src
          sh scripts/toolchain.sh
          echo "LOCAL_DING_TOOLCHAIN=$PWD/.cache/toolchain/armv7-eabihf--glibc--stable-2020.02-2" >> "$GITHUB_ENV"
          echo "LOCAL_DING_SYSROOT=$PWD/.cache/toolchain/armv7-eabihf--glibc--stable-2020.02-2/arm-buildroot-linux-gnueabihf/sysroot" >> "$GITHUB_ENV"
      - run: uv run --frozen python scripts/check_source.py
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: uv run --frozen python scripts/build.py && uv run --frozen python scripts/build.py --settings-test
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen python scripts/bundle.py
      - name: Isolated bundle check
        run: |
          mkdir /tmp/local-ding-bundle
          tar -xzf dist/local-ding-linux.tar.gz -C /tmp/local-ding-bundle
          cd /tmp/local-ding-bundle/local-ding
          ./local-ding-fw --help
      - run: docker build -t local-ding:ci . && docker run --rm local-ding:ci --help
      - uses: actions/upload-artifact@v4
        with:
          name: local-ding-linux
          path: dist/*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-ding-linux
          path: dist
      - name: Publish release and container
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p /tmp/local-ding-release
          tar -xzf dist/local-ding-linux.tar.gz -C /tmp/local-ding-release
          docker build -t "$image:$GITHUB_REF_NAME" /tmp/local-ding-release/local-ding
          docker push "$image:$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker tag "$image:$GITHUB_REF_NAME" "$image:latest"
            docker push "$image:latest"
          fi
