# Local admin settings are exposed only by the HTTPS server.
location ^~ /local-settings/api/ {
    client_max_body_size 16k;
    proxy_connect_timeout 3;
    proxy_read_timeout 20;
    proxy_pass http://127.0.0.1:9588/;
    proxy_set_header Host $http_host;
    proxy_set_header Connection close;
}

location ^~ /local-settings/ {
    alias /mnt/app/local-settings/;
    index index.html;
    add_header Cache-Control no-store;
    add_header X-Content-Type-Options nosniff;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
}
