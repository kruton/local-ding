[project]
name = "local-ding"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["target", "payload", "test-payload", "dist", ".work", ".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_format.py" = ["E402"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "shfmt-py>=4.2.0",
]
